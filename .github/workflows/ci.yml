name: ci

# Full test suite on every ordinary push, split into parallel jobs. Release
# builds are handled by release.yml, which reuses this workflow (workflow_call)
# and only builds once every job here has passed.

on:
  push:
    branches: ["**"]
  workflow_call:

permissions:
  contents: read

# A newer push to the same ref supersedes any run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Only main writes the cargo build cache; other branches restore from it.
  SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}

# Pinned runners: ubuntu-latest migrates to Ubuntu 26.04 from 2026-10-19; a
# newer glibc would raise the minimum distro requirement for released bundles.
jobs:
  shellcheck:
    name: Shellcheck scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck -s bash scripts/install_remote.sh
      - run: shellcheck deploy/launch.sh deploy/mihomo-server-user
      - run: shellcheck -s bash scripts/tests/multiuser/run.sh scripts/tests/multiuser/inside.sh

  lint:
    name: Rust fmt and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          save-cache: ${{ env.SAVE_CACHE }}
          cache-key: lint
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-test:
    name: Rust and packaging tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          save-cache: ${{ env.SAVE_CACHE }}
          cache-key: test
      - uses: ./.github/actions/setup-core
      - name: Rust tests
        env:
          MIHOMO_TEST_BINARY: ${{ github.workspace }}/.core/verge-mihomo
        run: cargo test --workspace --locked -- --test-threads=1
      # No MIHOMO_TEST_BINARY here: the systemd lifecycle test needs the
      # git-ignored ./data profiles and must stay skipped on CI.
      - name: Python packaging/installer tests
        run: python3 -m unittest discover -s scripts/tests

  multiuser-e2e:
    name: Multi-user install end-to-end (systemd container)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: ./.github/actions/setup-rust
        with:
          save-cache: ${{ env.SAVE_CACHE }}
          cache-key: multiuser
      - uses: ./.github/actions/setup-core
      # A debug service is enough here; release.yml packages the release build.
      - name: Package test bundle
        run: |
          cargo build --locked
          npm --prefix web ci
          npm --prefix web run build
          python3 scripts/package_bundle.py --target x86_64-unknown-linux-gnu \
            --mihomo .core/verge-mihomo --core-version "$(jq -r .version deploy/core-pin.json)" \
            --core-sha256 "$(jq -r .sha256 deploy/core-pin.json)" \
            --service target/debug/mihomo-server --web-dir web/dist --output "$RUNNER_TEMP/bundle"
      # Two concurrent TUN users, per-UID routing, crash/upgrade, cleanup.
      - name: Multi-user end-to-end
        run: scripts/tests/multiuser/run.sh "$RUNNER_TEMP/bundle"

  web-e2e:
    name: Web build and end-to-end tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: ./.github/actions/setup-rust
        with:
          save-cache: ${{ env.SAVE_CACHE }}
          cache-key: e2e
      - uses: ./.github/actions/setup-core

      # The e2e suite spawns target/debug/mihomo-server.
      - name: Build service binary
        run: cargo build --locked

      - name: Build web frontend
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Cache Playwright browsers
        id: playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Install Playwright system dependencies (browser cached)
        if: steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: web

      - name: Web end-to-end tests
        env:
          MIHOMO_TEST_BINARY: ${{ github.workspace }}/.core/verge-mihomo
        run: npx playwright test
        working-directory: web

      - name: Upload Playwright failures
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-failures
          path: web/test-results/
          if-no-files-found: ignore
