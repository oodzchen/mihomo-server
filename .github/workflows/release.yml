name: release

# Build, package and publish an installable bundle on v* tags only.
# The bundle builds alongside the full test suite (ci.yml); nothing is
# published until both have passed.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Full test suite
    uses: ./.github/workflows/ci.yml

  build-release:
    name: Build and package release (${{ matrix.target }})
    # Each target builds natively on its own runner. Pinned: ubuntu-latest
    # migrates to Ubuntu 26.04 from 2026-10-19. Release binaries must keep
    # linking against the 24.04 glibc so the bundle stays runnable on older
    # distros (Debian 12, Ubuntu 22.04, etc.).
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Automatic release notes need previous tags and commit history.

      - name: Prepare release notes (changelog or Git history)
        run: python3 scripts/release_notes.py --tag "$GITHUB_REF_NAME" --output dist/release-notes.md

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Tag-scoped caches are unreachable from later tags and main only holds
      # debug artifacts, so a release build always starts cold: skip the restore.
      - uses: ./.github/actions/setup-rust
        with:
          build-cache: "false"

      - uses: ./.github/actions/setup-core
        id: pin

      - name: Check runner target
        run: test "${{ steps.pin.outputs.target }}" = "$TARGET"

      - name: Build and package bundle
        env:
          # Where `mihomo-server update` fetches the installer from.
          MIHOMO_SERVER_REPOSITORY: ${{ github.repository }}
        run: |
          # Release builds report the tag as their version.
          export MIHOMO_SERVER_VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/package_bundle.py --build \
            --target "$TARGET" \
            --mihomo .core/verge-mihomo \
            --core-version "${{ steps.pin.outputs.version }}" \
            --core-sha256 "${{ steps.pin.outputs.sha256 }}" \
            --release-notes dist/release-notes.md \
            --output "dist/mihomo-server-$GITHUB_REF_NAME-$TARGET"

      - name: Smoke test bundle binary
        run: |
          dist/mihomo-server-$GITHUB_REF_NAME-$TARGET/bin/mihomo-server --help >/dev/null
          version=$(dist/mihomo-server-$GITHUB_REF_NAME-$TARGET/bin/mihomo-server --version)
          test "$version" = "mihomo-server ${GITHUB_REF_NAME#v}" || { echo "Version $version does not match $GITHUB_REF_NAME"; exit 1; }
          dist/mihomo-server-$GITHUB_REF_NAME-$TARGET/bin/mihomo-server serve --help >/dev/null
          echo "Binary runs on this glibc version."

      - name: Create tarball and checksum
        run: |
          cd dist
          tar -czf "mihomo-server-$GITHUB_REF_NAME-$TARGET.tar.gz" \
            "mihomo-server-$GITHUB_REF_NAME-$TARGET"
          sha256sum "mihomo-server-$GITHUB_REF_NAME-$TARGET.tar.gz" \
            > "mihomo-server-$GITHUB_REF_NAME-$TARGET.tar.gz.sha256"
          sha256sum -c "mihomo-server-$GITHUB_REF_NAME-$TARGET.tar.gz.sha256"

      # The installer is target-independent; publish it once.
      - name: Render install.sh with repository slug
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sed "s|local REPO=\"__REPO_SLUG__\"|local REPO=\"$GITHUB_REPOSITORY\"|" \
            scripts/install_remote.sh > dist/install.sh
          chmod +x dist/install.sh

      - name: Upload release assets
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}-assets
          path: |
            dist/mihomo-server-${{ github.ref_name }}-${{ env.TARGET }}.tar.gz
            dist/mihomo-server-${{ github.ref_name }}-${{ env.TARGET }}.tar.gz.sha256
            dist/install.sh
            dist/release-notes.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: [test, build-release]
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write # required to create the GitHub Release and update flake.nix
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/download-artifact@v7
        with:
          pattern: "*-assets"
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum -c ./*.sha256)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber dist/*
            gh release edit "$GITHUB_REF_NAME" --notes-file dist/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file dist/release-notes.md dist/*
          fi

      - name: Update flake.nix on main
        run: |
          python3 scripts/update_flake.py --tag "$GITHUB_REF_NAME" \
            --tarball "x86_64-linux=dist/mihomo-server-$GITHUB_REF_NAME-x86_64-unknown-linux-gnu.tar.gz" \
            --tarball "aarch64-linux=dist/mihomo-server-$GITHUB_REF_NAME-aarch64-unknown-linux-gnu.tar.gz"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          if git diff --staged --quiet; then
            echo "flake.nix is already up to date."
          else
            git commit -m "chore(flake): bump server release to $GITHUB_REF_NAME"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
