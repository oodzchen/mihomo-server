name: release

# Build, package and publish an installable bundle on v* tags only.
# The bundle builds alongside the full test suite (ci.yml); nothing is
# published until both have passed.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Full test suite
    uses: ./.github/workflows/ci.yml

  build-release:
    name: Build and package release
    # Pinned: ubuntu-latest migrates to Ubuntu 26.04 from 2026-10-19. Release
    # binaries must keep linking against the 24.04 glibc so the bundle stays
    # runnable on older distros (Debian 12, Ubuntu 22.04, etc.).
    runs-on: ubuntu-24.04
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: ./.github/actions/setup-rust
        with:
          save-cache: "false"
          cache-key: release

      - uses: ./.github/actions/setup-core

      - name: Read pinned core
        id: pin
        run: |
          echo "version=$(jq -r .version deploy/core-pin.json)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(jq -r .sha256 deploy/core-pin.json)" >> "$GITHUB_OUTPUT"

      - name: Build and package bundle
        env:
          # Where `mihomo-server update` fetches the installer from.
          MIHOMO_SERVER_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/package_bundle.py --build \
            --target "$TARGET" \
            --mihomo .core/verge-mihomo \
            --core-version "${{ steps.pin.outputs.version }}" \
            --core-sha256 "${{ steps.pin.outputs.sha256 }}" \
            --output "dist/mihomo-server-$GITHUB_REF_NAME-$TARGET"

      - name: Smoke test bundle binary
        run: |
          dist/mihomo-server-$GITHUB_REF_NAME-$TARGET/bin/mihomo-server --help >/dev/null
          dist/mihomo-server-$GITHUB_REF_NAME-$TARGET/bin/mihomo-server serve --help >/dev/null
          echo "Binary runs on this glibc version."

      - name: Create tarball and checksum
        run: |
          cd dist
          tar -czf "mihomo-server-$GITHUB_REF_NAME-$TARGET.tar.gz" \
            "mihomo-server-$GITHUB_REF_NAME-$TARGET"
          sha256sum "mihomo-server-$GITHUB_REF_NAME-$TARGET.tar.gz" \
            > "mihomo-server-$GITHUB_REF_NAME-$TARGET.tar.gz.sha256"
          sha256sum -c "mihomo-server-$GITHUB_REF_NAME-$TARGET.tar.gz.sha256"

      - name: Render install.sh with repository slug
        run: |
          sed "s|local REPO=\"__REPO_SLUG__\"|local REPO=\"$GITHUB_REPOSITORY\"|" \
            scripts/install_remote.sh > dist/install.sh
          chmod +x dist/install.sh

      - name: Upload release assets
        uses: actions/upload-artifact@v6
        with:
          name: release-assets
          path: |
            dist/mihomo-server-${{ github.ref_name }}-${{ env.TARGET }}.tar.gz
            dist/mihomo-server-${{ github.ref_name }}-${{ env.TARGET }}.tar.gz.sha256
            dist/install.sh
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-desktop:
    name: Build desktop packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-desktop

      - uses: ./.github/actions/setup-rust
        with:
          save-cache: "false"
          cache-key: desktop-release
          workspaces: desktop -> target

      - name: Install tauri-cli
        # Same minor as the tauri crate in desktop/Cargo.lock.
        run: cargo install tauri-cli --version 2.12.1 --locked

      - name: Build deb, rpm and AppImage
        env:
          # Where the client downloads the installer from.
          MIHOMO_SERVER_REPOSITORY: ${{ github.repository }}
          # linuxdeploy is itself an AppImage; runners have no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd desktop
          MIHOMO_DESKTOP_VERSION="$version" cargo tauri build --bundles deb,rpm,appimage \
            --config "{\"version\":\"$version\"}"

      - name: Smoke test and collect packages
        run: |
          bundle=desktop/target/release/bundle
          desktop/target/release/mihomo-server-desktop --version
          deb=$(ls "$bundle"/deb/*.deb); rpm=$(ls "$bundle"/rpm/*.rpm); image=$(ls "$bundle"/appimage/*.AppImage)
          dpkg-deb -I "$deb" >/dev/null
          (cd "$(mktemp -d)" && "$OLDPWD/$image" --appimage-extract >/dev/null && test -x squashfs-root/usr/bin/mihomo-server-desktop)
          base="mihomo-server-desktop-$GITHUB_REF_NAME-x86_64"
          mkdir -p dist
          cp "$deb" "dist/$base.deb"
          cp "$rpm" "dist/$base.rpm"
          cp "$image" "dist/$base.AppImage"
          cd dist
          for file in "$base".*; do sha256sum "$file" > "$file.sha256"; done
          sha256sum -c ./*.sha256

      - name: Upload desktop packages
        uses: actions/upload-artifact@v6
        with:
          name: desktop-assets
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: [test, build-release, build-desktop]
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write # required to create the GitHub Release
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: "*-assets"
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum -c ./*.sha256)
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
