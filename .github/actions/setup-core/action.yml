name: Set up pinned core
description: Download and verify the pinned mihomo core into .core/ (cached by pin sha256).
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: |
        echo "sha256=$(jq -r .sha256 deploy/core-pin.json)" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache@v5
      with:
        path: .core/verge-mihomo
        key: core-${{ steps.pin.outputs.sha256 }}
    - name: Download pinned core
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        version=$(jq -r .version deploy/core-pin.json)
        url=$(jq -r .download deploy/core-pin.json)
        url=$(printf '%s' "$url" | sed "s/{version}/$version/g")
        mkdir -p .core
        curl -fsSL --retry 3 -o .core/core.gz "$url"
        gunzip -c .core/core.gz > .core/verge-mihomo
        rm .core/core.gz
    - name: Verify pinned core
      shell: bash
      run: |
        chmod +x .core/verge-mihomo
        echo "${{ steps.pin.outputs.sha256 }}  .core/verge-mihomo" | sha256sum -c -
        .core/verge-mihomo -v
