name: Set up desktop build
description: Install the WebKitGTK, tray and bundling libraries the Tauri desktop client builds against.
runs:
  using: composite
  steps:
    - name: Install desktop build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
          build-essential file
