[package]
name = "mihomo-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors = ["oomeow"]
description = "Tauri-free extraction of the upstream Mihomo API client"

[package.metadata.upstream]
repository = "https://github.com/clash-verge-rev/tauri-plugin-mihomo"
revision = "ba8434c08c869916b8041d707ad66599bb5230b2"
license-status = "No license declaration found in the pinned upstream source"

[dependencies]
thiserror = "2"
reqwest = { version = "0.13", features = ["json", "query"] }
serde.workspace = true
serde_json.workspace = true
futures-util = "0.3"
tokio = { workspace = true, features = ["net", "io-util"] }
tokio-tungstenite = "0.28"
http = "1.3"
log = "0.4"
pin-project = "1.1"
arc-swap = "1.9"
percent-encoding = "2.3.2"
clashmap = "1.3.0"
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }

[dev-dependencies]
anyhow.workspace = true
tokio = { workspace = true, features = ["process", "fs"] }
