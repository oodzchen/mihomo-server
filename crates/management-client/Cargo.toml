[package]
name = "management-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Client for the mihomo-server management API: instance discovery, commands and response views"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
url = "2.5.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# `events`: subscriptions to the service's WebSocket feeds (plain ws:// only).
tokio-tungstenite = { version = "0.29", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink"], optional = true }
tokio = { workspace = true, optional = true }

[features]
events = ["dep:tokio-tungstenite", "dep:futures-util", "dep:tokio"]

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
