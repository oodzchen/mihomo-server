    restore_interrupted: Service is closing; inspect status before retrying restoration
    backup_restore_failed: Backup restoration failed; inspect service status before retrying
    backup_restore_validation_failed: Backup restore candidate failed validation; no configuration was applied
    invalid_backup_archive: Backup archive failed format, integrity or configuration checks
