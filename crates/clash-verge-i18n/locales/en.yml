    invalid_path: Invalid asset path
    not_found: Resource not found
    session_limit: WebSocket session limit reached
    invalid_upgrade: Invalid WebSocket upgrade request
    stream_not_found: Stream does not exist
    backup_busy: Backup operation unavailable; finish current operation and retry
    invalid_backup_request: Local backup requests must be empty
    invalid_backup_id: Invalid local backup ID
    backup_export_failed: Backup export unavailable; check source files and retry
    backup_storage_full: Local backup capacity reached; delete a retained backup and retry
    backup_not_found: Local backup not found
    backup_interrupted: Local backup operation interrupted; inspect retained backups before retrying
    backup_storage_failed: Local backup operation failed; inspect retained backups before retrying
    invalid_restore_policy: "Send one X-Backup-Runtime header: archived or regenerated"
    invalid_backup_media: Send an unencoded application/zip body
