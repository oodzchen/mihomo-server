[package]
name = "mihomo-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Single service entry point for headless Mihomo management"

[dependencies]
headless-core.workspace = true
mihomo-client.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
smartstring.workspace = true
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
getrandom = "0.4.3"
url = "2.5.8"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", features = ["fs"] }
percent-encoding = "2.3.2"
ring = "=0.17.14"
reqwest = { version = "0.13", features = ["json", "system-proxy"] }
webpki-root-certs = "=1.0.9"
tokio = { workspace = true, features = ["process", "signal", "fs", "io-util"] }
clap = { version = "4.6.5", default-features = false, features = ["std", "help", "usage", "error-context"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
rustls = { version = "=0.23.45", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
tokio-rustls = "=0.26.5"
tokio-tungstenite = "0.29"
futures-util = "0.3"
