[package]
name = "mihomo-server-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "GPL-3.0-only"
publish = false
description = "Desktop window and tray for the local mihomo-server instance"

# Separate workspace: building it needs webkit2gtk, which the service never does.
[workspace]

[build-dependencies]
tauri-build = { version = "2.7.1", default-features = false , features = [] }

[dependencies]
management-client = { path = "../crates/management-client", features = ["events"] }
tauri = { version = "2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5.2"
anyhow = "1.0.104"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "socks", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sys-locale = "0.3.2"
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "linux")'.dependencies]
# Already used by the single-instance plugin; sends failure notifications.
zbus = "5.9"
# Selects tray-icon's D-Bus StatusNotifierItem backend for Tauri's tray: unlike
# libappindicator it reports left clicks (Activate) and shows tooltips.
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
