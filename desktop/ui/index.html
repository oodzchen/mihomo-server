<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mihomo Server</title>
  <link rel="stylesheet" href="setup.css">
  <script src="setup.js" defer></script>
</head>
<body>
  <button id="settings-open" class="corner" type="button">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
  </button>
  <main aria-live="polite">
    <img class="logo" src="app.svg" alt="" width="56" height="56">
    <h1>Mihomo Server</h1>
    <p id="status" class="status"></p>
    <button id="primary" class="primary" type="button">
      <span class="spinner" aria-hidden="true"></span><span id="label"></span>
    </button>
  </main>
  <section id="output" class="output">
    <pre id="log" tabindex="0" aria-label="Output"></pre>
    <button id="toggle" class="toggle" type="button" aria-controls="log" aria-expanded="false"></button>
  </section>
  <section id="settings" class="settings" aria-labelledby="settings-title" hidden>
    <header>
      <button id="settings-back" class="corner back" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h2 id="settings-title"></h2>
    </header>
    <div class="field">
      <label id="language-label" for="language"></label>
      <select id="language">
        <option value="zh">简体中文</option>
        <option value="zhtw">繁體中文</option>
        <option value="en">English</option>
      </select>
      <p id="language-hint" class="hint"></p>
      <p id="language-result" class="result" role="status"></p>
    </div>
    <div class="field">
      <label id="proxy-label" for="proxy"></label>
      <div class="row">
        <input id="proxy" type="text" placeholder="http://127.0.0.1:7890" spellcheck="false" autocomplete="off" autocapitalize="off">
        <button id="proxy-test" class="secondary" type="button"><span class="spinner" aria-hidden="true"></span><span id="proxy-test-label"></span></button>
      </div>
      <p id="proxy-hint" class="hint"></p>
      <p id="proxy-result" class="result" role="status"></p>
    </div>
  </section>
</body>
</html>
